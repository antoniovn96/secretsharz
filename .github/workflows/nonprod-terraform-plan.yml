on:
  workflow_dispatch:
    inputs:
      ecs_image_uri:
        description: "Immutable SHA-tagged ECR image URI for secretsharz-nonprod in ap-southeast-2"
        required: true
        type: string
        default: "${{ inputs.ecs_image_uri }}"

permissions:
  contents: read
  id-token: write

concurrency:
  group: secretsharz-nonprod-terraform-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Plan nonprod with remote state
    runs-on: ubuntu-latest
    environment: nonprod
    env:
      AWS_REGION: ap-southeast-2
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TERRAFORM_STATE_KEY: secretsharz/nonprod/terraform.tfstate
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_ecs_enabled: "true"
      TF_VAR_ecs_image_uri: "${{ inputs.ecs_image_uri }}"
      TF_VAR_assessment_migration_runner_enabled: "true"
      TF_VAR_assessment_migration_runner_image_uri: "${{ inputs.ecs_image_uri }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate immutable nonprod image URI
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TF_VAR_ecs_image_uri" =~ ^[0-9]{12}\.dkr\.ecr\.ap-southeast-2\.amazonaws\.com/secretsharz-nonprod:[0-9a-f]{40}$ ]]; then
            echo "::error::Use an immutable 40-character SHA tag in the secretsharz-nonprod ECR repository in ap-southeast-2."
            exit 1
          fi
          EXPECTED_REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          ACTUAL_REGISTRY="${TF_VAR_ecs_image_uri%%/*}"
          if [ "$ACTUAL_REGISTRY" != "$EXPECTED_REGISTRY" ]; then
            echo "::error::The ECR image account does not match the configured nonprod AWS account."
            exit 1
          fi
          IMAGE_TAG="${TF_VAR_ecs_image_uri##*:}"
          aws ecr describe-images --repository-name secretsharz-nonprod --image-ids imageTag="$IMAGE_TAG" --region "$AWS_REGION" >/dev/null
          echo "- ECS image URI: `$TF_VAR_ecs_image_uri`" >> "$GITHUB_STEP_SUMMARY"


      - name: Verify remote state configuration
        run: |
          set -euo pipefail

          if [ -z "$TERRAFORM_STATE_BUCKET" ]; then
            echo "::error::Missing nonprod Environment variable TERRAFORM_STATE_BUCKET."
            exit 1
          fi

          aws s3api head-bucket             --bucket "$TERRAFORM_STATE_BUCKET"             --region "$AWS_REGION"

          echo "Remote state bucket is reachable."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform init with remote state
        working-directory: infra/terraform/environments/nonprod
        run: |
          terraform init             -reconfigure             -input=false             -backend-config="bucket=$TERRAFORM_STATE_BUCKET"             -backend-config="key=$TERRAFORM_STATE_KEY"             -backend-config="region=$AWS_REGION"

      - name: Terraform plan
        working-directory: infra/terraform/environments/nonprod
        run: |
          terraform plan             -input=false             -lock-timeout=5m             -out=nonprod.tfplan

      - name: Plan summary
        working-directory: infra/terraform/environments/nonprod
        run: |
          terraform show -no-color nonprod.tfplan > nonprod-plan.txt

          {
            echo "### Non-production Terraform plan"
            echo "- Remote state: `$TERRAFORM_STATE_BUCKET/$TERRAFORM_STATE_KEY`"
            echo "- Region: `$AWS_REGION`"
            echo "- This workflow performs plan only; it does not apply infrastructure."
            echo ""
            echo "Plan detail is intentionally kept in the runner workspace and is not uploaded as an artifact."
            echo "- Plan file: `infra/terraform/environments/nonprod/nonprod.tfplan`"
            echo "- Human-readable plan: `infra/terraform/environments/nonprod/nonprod-plan.txt`"
          } >> "$GITHUB_STEP_SUMMARY"
