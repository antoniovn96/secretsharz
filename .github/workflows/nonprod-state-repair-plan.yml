name: Secret Sharz Nonprod State Repair Plan

on:
  push:
    branches:
      - rebuild/platform-foundation-v1

permissions:
  contents: read
  id-token: write

concurrency:
  group: secretsharz-nonprod-state-repair-plan
  cancel-in-progress: false

jobs:
  repair:
    name: Untaint partial apply resources and replan
    runs-on: ubuntu-latest
    environment: nonprod
    env:
      AWS_REGION: ap-southeast-2
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TERRAFORM_STATE_KEY: secretsharz/nonprod/terraform.tfstate
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform init
        working-directory: infra/terraform/environments/nonprod
        run: |
          set -euo pipefail
          terraform init             -reconfigure             -input=false             -backend-config="bucket=$TERRAFORM_STATE_BUCKET"             -backend-config="key=$TERRAFORM_STATE_KEY"             -backend-config="region=$AWS_REGION"

      - name: Repair tainted state entries
        working-directory: infra/terraform/environments/nonprod
        run: |
          set -euo pipefail
          for resource in             'module.container_registry.aws_ecr_repository.this'             'module.network.aws_subnet.public[0]'             'module.network.aws_subnet.public[1]'; do
            terraform state untaint "$resource" || true
          done

      - name: Replan after state repair
        working-directory: infra/terraform/environments/nonprod
        run: |
          set -euo pipefail
          terraform plan             -input=false             -lock-timeout=5m             -out=nonprod-recovery.tfplan

          terraform show -no-color nonprod-recovery.tfplan > nonprod-recovery-plan.txt

          {
            echo "### Non-production state repair plan"
            grep -E '^Plan:|^No changes' nonprod-recovery-plan.txt || true
            echo ""
            echo "No infrastructure apply is performed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
