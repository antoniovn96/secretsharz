name: Secret Sharz Nonprod DB Migration Diagnose

on:
  push:
    branches:
      - rebuild/platform-foundation-v1

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'chore(nonprod): inspect latest migration task'
    runs-on: ubuntu-latest
    environment: nonprod
    env:
      AWS_REGION: ap-southeast-2
      CLUSTER_NAME: secretsharz-nonprod-assessment-migrations
      TASK_ARN: arn:aws:ecs:ap-southeast-2:078809710022:task/secretsharz-nonprod-assessment-migrations/72d3c29b41744b3686e4f3caab787edf
      LOG_GROUP: /ecs/secretsharz-nonprod-assessment-migrations

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inspect stopped task
        run: |
          set -euo pipefail
          aws ecs describe-tasks             --cluster "$CLUSTER_NAME"             --tasks "$TASK_ARN"             --region "$AWS_REGION"             --query 'tasks[0].{taskArn:taskArn,lastStatus:lastStatus,desiredStatus:desiredStatus,stopCode:stopCode,stoppedReason:stoppedReason,stoppedAt:stoppedAt,taskDefinition:taskDefinition,launchType:launchType,connectivity:connectivity,connectivityAt:connectivityAt,containers:containers[*].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason,healthStatus:healthStatus,runtimeId:runtimeId,lastStatusReason:lastStatusReason}}'             --output json

      - name: Inspect migration task definition
        run: |
          set -euo pipefail
          aws ecs describe-task-definition             --task-definition secretsharz-nonprod-assessment-migrations             --region "$AWS_REGION"             --query 'taskDefinition.{family:family,revision:revision,status:status,image:containerDefinitions[0].image,command:containerDefinitions[0].command,entryPoint:containerDefinitions[0].entryPoint,environment:containerDefinitions[0].environment,secrets:containerDefinitions[0].secrets,logConfiguration:containerDefinitions[0].logConfiguration}'             --output json

      - name: Inspect migration log group
        run: |
          set -euo pipefail
          aws logs describe-log-groups             --log-group-name-prefix "$LOG_GROUP"             --region "$AWS_REGION"             --query 'logGroups[*].{name:logGroupName,retention:retentionInDays,storedBytes:storedBytes}'             --output json

          echo "### FilterLogEvents sample"
          aws logs filter-log-events             --log-group-name "$LOG_GROUP"             --region "$AWS_REGION"             --limit 50             --output json || true
