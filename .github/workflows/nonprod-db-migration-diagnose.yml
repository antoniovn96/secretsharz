name: Secret Sharz Nonprod DB Migration Diagnose

on:
  push:
    branches:
      - rebuild/platform-foundation-v1

permissions:
  contents: read
  id-token: write

concurrency:
  group: secretsharz-nonprod-db-migration-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose latest failed DB migration task
    if: github.event.head_commit.message == 'chore(nonprod): diagnose latest DB migration'
    runs-on: ubuntu-latest
    environment: nonprod
    env:
      AWS_REGION: ap-southeast-2
      CLUSTER_NAME: secretsharz-nonprod-assessment-migrations
      LOG_GROUP: /ecs/secretsharz-nonprod-assessment-migrations

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover latest stopped migration task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          TASK_ARN="$(aws ecs list-tasks             --cluster "$CLUSTER_NAME"             --desired-status STOPPED             --region "$AWS_REGION"             --query 'taskArns[0]'             --output text)"
          test "$TASK_ARN" != "None"
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Migration task: $TASK_ARN"

      - name: Describe latest migration task
        run: |
          set -euo pipefail
          TASK_ARN="${{ steps.task.outputs.task_arn }}"
          aws ecs describe-tasks             --cluster "$CLUSTER_NAME"             --tasks "$TASK_ARN"             --region "$AWS_REGION"             --query 'tasks[0].{lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,taskDefinition:taskDefinition,containers:containers[*].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason,lastStatusReason:lastStatusReason}}'             --output json

      - name: Show latest migration log stream
        run: |
          set -euo pipefail
          STREAM="$(aws logs describe-log-streams             --log-group-name "$LOG_GROUP"             --region "$AWS_REGION"             --order-by LastEventTime             --descending             --max-items 1             --query 'logStreams[0].logStreamName'             --output text)"
          test "$STREAM" != "None"
          echo "Log stream: $STREAM"
          aws logs get-log-events             --log-group-name "$LOG_GROUP"             --log-stream-name "$STREAM"             --region "$AWS_REGION"             --limit 200             --query 'events[*].message'             --output text
