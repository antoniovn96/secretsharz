name: Temporary setDoc import fix

on:
  push:
    branches:
      - codex/razorpay-integration-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: codex/razorpay-integration-v1
          fetch-depth: 0

      - name: Apply import fix
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p = Path('src/CareerAssessment.jsx')
          text = p.read_text()
          old = "import { doc, getDoc, updateDoc, arrayUnion } from 'firebase/firestore';"
          new = "import { doc, getDoc, updateDoc, setDoc, arrayUnion } from 'firebase/firestore';"
          if old in text:
              p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CareerAssessment.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix missing setDoc Firestore import"
          git push origin HEAD:codex/razorpay-integration-v1
