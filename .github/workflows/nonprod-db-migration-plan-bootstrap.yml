name: Secret Sharz Nonprod DB Migration Plan

on:
  push:
    branches:
      - rebuild/platform-foundation-v1

permissions:
  contents: read
  id-token: write

concurrency:
  group: secretsharz-nonprod-db-migration-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Plan nonprod PostgreSQL migrations
    if: github.event.head_commit.message == '[PLAN_DB_MIGRATIONS_NONPROD]'
    runs-on: ubuntu-latest
    environment: nonprod
    env:
      AWS_REGION: ap-southeast-2
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TERRAFORM_STATE_KEY: secretsharz/nonprod/terraform.tfstate
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_assessment_migration_runner_enabled: "true"
      TF_VAR_assessment_migration_runner_image_uri: "078809710022.dkr.ecr.ap-southeast-2.amazonaws.com/secretsharz-nonprod@sha256:f3e29a07aa2ca6b3cf6ef4b70daa6dd7c0e0595c6cad83fd59789a0369e719cb"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform init
        working-directory: infra/terraform/environments/nonprod
        run: |
          set -euo pipefail
          terraform init             -reconfigure             -input=false             -backend-config="bucket=$TERRAFORM_STATE_BUCKET"             -backend-config="key=$TERRAFORM_STATE_KEY"             -backend-config="region=$AWS_REGION"

      - name: Terraform plan
        working-directory: infra/terraform/environments/nonprod
        run: |
          set -euo pipefail
          terraform plan             -input=false             -lock-timeout=5m             -out=nonprod-db-migration.tfplan

          terraform show -no-color nonprod-db-migration.tfplan > nonprod-db-migration-plan.txt

          {
            echo "### Non-production PostgreSQL migration runner plan"
            grep -E '^Plan:|^No changes' nonprod-db-migration-plan.txt || true
            echo ""
            echo "Image: $TF_VAR_assessment_migration_runner_image_uri"
            echo "Command: node scripts/run-postgres-migrations.mjs"
            echo "This workflow performs plan only; it does not apply or run migrations."
          } >> "$GITHUB_STEP_SUMMARY"
