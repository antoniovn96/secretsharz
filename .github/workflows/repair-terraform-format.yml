name: Repair Terraform formatting

on:
  push:
    branches:
      - rebuild/platform-foundation-v1
    paths:
      - "infra/terraform/**"
      - ".github/workflows/repair-terraform-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'ci: format Terraform'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Format Terraform
        working-directory: infra/terraform
        run: terraform fmt -recursive

      - name: Commit Terraform formatting
        run: |
          set -euo pipefail
          if git diff --quiet -- infra/terraform; then
            echo "Terraform formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/terraform
          git commit -m "ci: format Terraform"
          git push origin HEAD:rebuild/platform-foundation-v1
