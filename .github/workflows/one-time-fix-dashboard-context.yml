name: One-time DashboardContext fix

on:
  push:
    branches:
      - foundation/step-2g-design-system

permissions:
  contents: write

jobs:
  fix-dashboard-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch DashboardContext
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/context/DashboardContext.js')
          text = path.read_text(encoding='utf-8')

          old_function_header = """  const calculateExPoints = useCallback((profileData) => {\n    const data = profileData || userProfile;"""
          new_function_header = """  const calculateExPoints = useCallback((profileData) => {\n    // Pure calculation: callers pass the profile snapshot they want scored.\n    // Keeping this function free of state updates prevents a dependency loop\n    // between calculateExPoints and the Firebase profile-loading effect.\n    const data = profileData || DEFAULT_USER_PROFILE;"""
          if old_function_header not in text:
              raise SystemExit('Expected calculateExPoints header not found; aborting without changes.')
          text = text.replace(old_function_header, new_function_header, 1)

          old_persist = """    // ── Persist to state ─────────────────────────────────────────────────\n    setUserProfile(prev => ({ ...prev, exPoints: points }));\n\n    return points;\n  }, [userProfile]);"""
          new_persist = """    return points;\n  }, []);"""
          if old_persist not in text:
              raise SystemExit('Expected calculateExPoints state-update block not found; aborting without changes.')
          text = text.replace(old_persist, new_persist, 1)

          old_fetch = """            setUserProfile(prev => {\n              const merged = { ...prev, ...dbData };\n              // Deep-merge the education sub-object safely\n              if (dbData.education) {\n                merged.education = { ...prev.education, ...dbData.education };\n              }\n              return merged;\n            });\n            \n            // Recalculate the gamified XP points automatically after fetching\n            setTimeout(() => {\n              setUserProfile(curr => ({ ...curr, exPoints: calculateExPoints(curr) }));\n            }, 100);"""
          new_fetch = """            setUserProfile(prev => {\n              const merged = { ...prev, ...dbData };\n              // Deep-merge the education sub-object safely\n              if (dbData.education) {\n                merged.education = { ...prev.education, ...dbData.education };\n              }\n              // Calculate XP from the merged snapshot without scheduling a\n              // second state update or re-running the auth effect.\n              return { ...merged, exPoints: calculateExPoints(merged) };\n            });"""
          if old_fetch not in text:
              raise SystemExit('Expected Firebase profile-load block not found; aborting without changes.')
          text = text.replace(old_fetch, new_fetch, 1)

          path.write_text(text, encoding='utf-8')
          print('DashboardContext.js patched successfully.')

      - name: Remove one-time workflow
        run: rm -f .github/workflows/one-time-fix-dashboard-context.yml

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/DashboardContext.js .github/workflows/one-time-fix-dashboard-context.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: prevent DashboardContext hydration dependency loop"
          git push origin HEAD:foundation/step-2g-design-system
