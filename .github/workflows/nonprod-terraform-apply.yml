name: Secret Sharz Nonprod Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_NONPROD to authorize the non-production infrastructure apply
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: secretsharz-nonprod-terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply nonprod infrastructure
    if: ${{ inputs.confirmation == 'APPLY_NONPROD' }}
    runs-on: ubuntu-latest
    environment: nonprod
    env:
      AWS_REGION: ap-southeast-2
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TERRAFORM_STATE_KEY: secretsharz/nonprod/terraform.tfstate
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_ecs_enabled: "true"
      TF_VAR_ecs_image_uri: "078809710022.dkr.ecr.ap-southeast-2.amazonaws.com/secretsharz-nonprod:c216bb1831ce3ea27fb4b57d4c42b6f089f28b4e"
      TF_VAR_assessment_migration_runner_enabled: "true"
      TF_VAR_assessment_migration_runner_image_uri: "078809710022.dkr.ecr.ap-southeast-2.amazonaws.com/secretsharz-nonprod:c216bb1831ce3ea27fb4b57d4c42b6f089f28b4e"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify remote state configuration
        run: |
          set -euo pipefail
          test -n "$TERRAFORM_STATE_BUCKET"
          aws s3api head-bucket \
            --bucket "$TERRAFORM_STATE_BUCKET" \
            --region "$AWS_REGION"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform init with remote state
        working-directory: infra/terraform/environments/nonprod
        run: |
          terraform init \
            -reconfigure \
            -input=false \
            -backend-config="bucket=$TERRAFORM_STATE_BUCKET" \
            -backend-config="key=$TERRAFORM_STATE_KEY" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform plan
        working-directory: infra/terraform/environments/nonprod
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=nonprod.tfplan

      - name: Terraform apply reviewed run plan
        working-directory: infra/terraform/environments/nonprod
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            nonprod.tfplan

      - name: Terraform outputs
        working-directory: infra/terraform/environments/nonprod
        run: |
          terraform output
