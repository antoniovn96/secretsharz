name: Secret Sharz Nonprod DB Migration Apply Bootstrap

on:
  push:
    branches:
      - rebuild/platform-foundation-v1

permissions:
  contents: read
  id-token: write

concurrency:
  group: secretsharz-nonprod-db-migration-apply
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migration runner and run PostgreSQL migrations
    if: github.event.head_commit.message == '[APPLY_DB_MIGRATIONS_NONPROD]'
    runs-on: ubuntu-latest
    environment: nonprod
    env:
      AWS_REGION: ap-southeast-2
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TERRAFORM_STATE_KEY: secretsharz/nonprod/terraform.tfstate
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_ecs_enabled: "true"
      TF_VAR_ecs_image_uri: "078809710022.dkr.ecr.ap-southeast-2.amazonaws.com/secretsharz-nonprod@sha256:f3e29a07aa2ca6b3cf6ef4b70daa6dd7c0e0595c6cad83fd59789a0369e719cb"
      TF_VAR_assessment_migration_runner_enabled: "true"
      TF_VAR_assessment_migration_runner_image_uri: "078809710022.dkr.ecr.ap-southeast-2.amazonaws.com/secretsharz-nonprod@sha256:f3e29a07aa2ca6b3cf6ef4b70daa6dd7c0e0595c6cad83fd59789a0369e719cb"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform init
        working-directory: infra/terraform/environments/nonprod
        run: |
          set -euo pipefail
          terraform init             -reconfigure             -input=false             -backend-config="bucket=$TERRAFORM_STATE_BUCKET"             -backend-config="key=$TERRAFORM_STATE_KEY"             -backend-config="region=$AWS_REGION"

      - name: Terraform plan
        working-directory: infra/terraform/environments/nonprod
        run: |
          set -euo pipefail
          terraform plan             -input=false             -lock-timeout=5m             -out=nonprod-db-migration.tfplan

      - name: Terraform apply migration runner
        working-directory: infra/terraform/environments/nonprod
        run: |
          set -euo pipefail
          terraform apply             -input=false             -auto-approve             nonprod-db-migration.tfplan

      - name: Run PostgreSQL migrations
        working-directory: infra/terraform/environments/nonprod
        run: |
          set -euo pipefail

          PRIVATE_SUBNETS="$(terraform output -json private_subnet_ids | jq -r '.[]' | paste -sd, -)"
          APPLICATION_SG="$(terraform output -raw application_security_group_id)"
          CLUSTER="$(terraform output -raw assessment_migration_runner_cluster_name)"
          TASK_DEFINITION="$(terraform output -raw assessment_migration_runner_task_definition_arn)"

          TASK_ARN="$(aws ecs run-task             --cluster "$CLUSTER"             --task-definition "$TASK_DEFINITION"             --launch-type FARGATE             --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNETS],securityGroups=[$APPLICATION_SG],assignPublicIp=DISABLED}"             --region "$AWS_REGION"             --query 'tasks[0].taskArn'             --output text)"

          test -n "$TASK_ARN"
          echo "Migration task: $TASK_ARN"

          for attempt in $(seq 1 40); do
            STATUS="$(aws ecs describe-tasks               --cluster "$CLUSTER"               --tasks "$TASK_ARN"               --region "$AWS_REGION"               --query 'tasks[0].lastStatus'               --output text)"

            echo "Migration task status: $STATUS"

            if [ "$STATUS" = "STOPPED" ]; then
              EXIT_CODE="$(aws ecs describe-tasks                 --cluster "$CLUSTER"                 --tasks "$TASK_ARN"                 --region "$AWS_REGION"                 --query 'tasks[0].containers[0].exitCode'                 --output text)"
              STOPPED_REASON="$(aws ecs describe-tasks                 --cluster "$CLUSTER"                 --tasks "$TASK_ARN"                 --region "$AWS_REGION"                 --query 'tasks[0].stoppedReason'                 --output text)"

              echo "Migration exit code: $EXIT_CODE"
              echo "Migration stopped reason: $STOPPED_REASON"

              if [ "$EXIT_CODE" = "0" ]; then
                echo "### PostgreSQL migrations completed successfully" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              echo "### PostgreSQL migration task failed" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            sleep 15
          done

          echo "Migration task did not stop within the expected window."
          exit 1

      - name: Terraform outputs
        working-directory: infra/terraform/environments/nonprod
        run: terraform output
