name: Secret Sharz Career Assessment Tests

on:
  pull_request:
    paths:
      - "src/career/**"
      - "src/platform/assessment*"
      - "src/platform/riasecAssessmentService.js"
      - "src/platform/legacyAssessmentMigration.js"
      - "src/platform/postgres.js"
      - "pages/api/career/assessment/**"
      - "infra/postgres/migrations/**"
      - "scripts/run-postgres-migrations.mjs"
      - "test/career/**"
      - "test/platform/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/career-assessment.yml"
  push:
    branches:
      - main
      - rebuild/platform-foundation-v1
    paths:
      - "src/career/**"
      - "src/platform/assessment*"
      - "src/platform/riasecAssessmentService.js"
      - "src/platform/postgres.js"
      - "pages/api/career/assessment/**"
      - "infra/postgres/migrations/**"
      - "scripts/run-postgres-migrations.mjs"
      - "test/career/**"
      - "test/platform/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/career-assessment.yml"

permissions:
  contents: write

jobs:
  career-assessment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secretsharz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d secretsharz"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/secretsharz
      DATABASE_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm

      - name: Synchronize npm lockfile during rebuild branch migration
        if: github.ref == 'refs/heads/rebuild/platform-foundation-v1'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Persist synchronized npm lockfile
        if: github.ref == 'refs/heads/rebuild/platform-foundation-v1'
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "ci: synchronize package lock"
            git push origin HEAD:rebuild/platform-foundation-v1
          fi

      - name: Install
        run: npm ci

      - name: Run PostgreSQL migrations
        run: npm run db:migrate

      - name: Verify PostgreSQL assessment schema
        run: node scripts/verify-assessment-schema.mjs

      - name: Run career assessment tests
        run: npm run test:career-assessment
