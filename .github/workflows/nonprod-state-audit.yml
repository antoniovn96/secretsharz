name: Secret Sharz Nonprod State Audit

on:
  push:
    branches:
      - rebuild/platform-foundation-v1

permissions:
  contents: read
  id-token: write

concurrency:
  group: secretsharz-nonprod-state-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit partial nonprod apply state
    runs-on: ubuntu-latest
    environment: nonprod
    env:
      AWS_REGION: ap-southeast-2
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TERRAFORM_STATE_KEY: secretsharz/nonprod/terraform.tfstate
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform init
        working-directory: infra/terraform/environments/nonprod
        run: |
          set -euo pipefail
          terraform init             -reconfigure             -input=false             -backend-config="bucket=$TERRAFORM_STATE_BUCKET"             -backend-config="key=$TERRAFORM_STATE_KEY"             -backend-config="region=$AWS_REGION"

      - name: Audit Terraform state
        working-directory: infra/terraform/environments/nonprod
        run: |
          set -euo pipefail
          echo "### Terraform state list"
          terraform state list

          echo "### Problem resources"
          for resource in             module.container_registry.aws_ecr_repository.this             module.network.aws_subnet.public[0]             module.network.aws_subnet.public[1]             module.network.aws_eip.nat[0]             module.network.aws_vpc.this             module.network.aws_internet_gateway.this             module.postgres.aws_db_instance.this; do
            echo "--- $resource ---"
            terraform state show "$resource" 2>&1 || true
          done

      - name: Audit AWS resources
        run: |
          set -euo pipefail

          echo "### ECR repository"
          aws ecr describe-repositories             --repository-names secretsharz-nonprod             --region "$AWS_REGION" 2>&1 || true

          echo "### Published ECR image digests"
          aws ecr describe-images             --repository-name secretsharz-nonprod             --region "$AWS_REGION"             --query 'sort_by(imageDetails,&imagePushedAt)[-10:].{digest:imageDigest,tags:imageTags,pushed:imagePushedAt}'             --output json || true

          echo "### ECR images"
          aws ecr describe-images             --repository-name secretsharz-nonprod             --region "$AWS_REGION"             --query 'imageDetails[*].{digest:imageDigest,tags:imageTags,size:imageSizeInBytes}'             --output json 2>&1 || true

          echo "### RDS"
          aws rds describe-db-instances             --db-instance-identifier secretsharz-nonprod-postgres             --region "$AWS_REGION"             --query 'DBInstances[*].{id:DBInstanceIdentifier,status:DBInstanceStatus,arn:DBInstanceArn}'             --output json 2>&1 || true

          echo "### VPC"
          aws ec2 describe-vpcs             --filters "Name=tag:Name,Values=secretsharz-nonprod"             --region "$AWS_REGION"             --query 'Vpcs[*].{id:VpcId,state:State,cidr:CidrBlock}'             --output json

          echo "### Subnets"
          aws ec2 describe-subnets             --filters "Name=tag:Name,Values=secretsharz-nonprod-public-*"             --region "$AWS_REGION"             --query 'Subnets[*].{id:SubnetId,state:State,cidr:CidrBlock,publicIpOnLaunch:MapPublicIpOnLaunch,vpc:VpcId}'             --output json 2>&1 || true

          echo "### NAT gateways"
          aws ec2 describe-nat-gateways             --filter "Name=vpc-id,Values=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=secretsharz-nonprod" --query 'Vpcs[0].VpcId' --output text)"             --region "$AWS_REGION"             --query 'NatGateways[*].{id:NatGatewayId,state:State,subnet:SubnetId}'             --output json 2>&1 || true

      - name: Diagnose PostgreSQL connectivity
        run: |
          set -euo pipefail

          PRIVATE_SUBNETS="$(aws ec2 describe-subnets             --filters "Name=tag:Name,Values=secretsharz-nonprod-private-*"             --region "$AWS_REGION"             --query 'Subnets[*].SubnetId'             --output text | tr '\t' ',' | sed 's/^/[/; s/$/]/')"

          VPC_ID="$(aws ec2 describe-vpcs             --filters "Name=tag:Name,Values=secretsharz-nonprod"             --region "$AWS_REGION"             --query 'Vpcs[0].VpcId'             --output text)"

          APPLICATION_SG="$(aws ec2 describe-security-groups             --filters "Name=group-name,Values=secretsharz-nonprod-application" "Name=vpc-id,Values=$VPC_ID"             --region "$AWS_REGION"             --query 'SecurityGroups[0].GroupId'             --output text)"

          TASK_DEFINITION="arn:aws:ecs:ap-southeast-2:078809710022:task-definition/secretsharz-nonprod-assessment-migrations:2"

          DIAG_SCRIPT="$(cat <<'NODE'
          const dns = require('node:dns').promises;
          const net = require('node:net');
          const { Client } = require('pg');

          (async () => {
            const required = ['DATABASE_HOST','DATABASE_PORT','DATABASE_NAME','DATABASE_USER','DATABASE_PASSWORD'];
            if (required.some((k) => !process.env[k])) process.exit(11);

            try {
              await dns.lookup(process.env.DATABASE_HOST);
            } catch (_) {
              process.exit(12);
            }

            await new Promise((resolve) => {
              const s = net.createConnection(
                { host: process.env.DATABASE_HOST, port: Number(process.env.DATABASE_PORT || 5432) },
                () => { s.destroy(); resolve(); }
              );
              s.setTimeout(8000, () => { s.destroy(); process.exit(13); });
              s.on('error', () => { s.destroy(); process.exit(13); });
            });

            const client = new Client({
              host: process.env.DATABASE_HOST,
              port: Number(process.env.DATABASE_PORT || 5432),
              database: process.env.DATABASE_NAME,
              user: process.env.DATABASE_USER,
              password: process.env.DATABASE_PASSWORD,
              ssl: { rejectUnauthorized: true }
            });

            try {
              await client.connect();
              await client.query('SELECT 1');
              await client.end();
              process.exit(0);
            } catch (e) {
              const m = String(e && e.message || e);
              if (/password authentication failed|28P01/i.test(m)) process.exit(20);
              if (/certificate|self-signed|unable to verify|unable to get local issuer/i.test(m)) process.exit(40);
              if (/timeout|ECONNREFUSED|ECONNRESET|ENETUNREACH/i.test(m)) process.exit(13);
              process.exit(21);
            }
          })().catch(() => process.exit(21));
          NODE
          )"

          OVERRIDES="$(jq -n             --arg name "secretsharz-nonprod-assessment-migrations"             --arg script "$DIAG_SCRIPT"             '{containerOverrides:[{name:$name,command:["node","-e",$script]}]}')"

          TASK_ARN="$(aws ecs run-task             --cluster secretsharz-nonprod-assessment-migrations             --task-definition "$TASK_DEFINITION"             --launch-type FARGATE             --overrides "$OVERRIDES"             --network-configuration "awsvpcConfiguration={subnets=$PRIVATE_SUBNETS,securityGroups=[$APPLICATION_SG],assignPublicIp=DISABLED}"             --region "$AWS_REGION"             --query 'tasks[0].taskArn'             --output text)"

          echo "Diagnostic task: $TASK_ARN"

          for attempt in $(seq 1 40); do
            STATUS="$(aws ecs describe-tasks               --cluster secretsharz-nonprod-assessment-migrations               --tasks "$TASK_ARN"               --region "$AWS_REGION"               --query 'tasks[0].lastStatus'               --output text)"

            if [ "$STATUS" = "STOPPED" ]; then
              EXIT_CODE="$(aws ecs describe-tasks                 --cluster secretsharz-nonprod-assessment-migrations                 --tasks "$TASK_ARN"                 --region "$AWS_REGION"                 --query 'tasks[0].containers[0].exitCode'                 --output text)"

              case "$EXIT_CODE" in
                0) echo "DATABASE_CONNECTION_OK" ;;
                11) echo "MISSING_DATABASE_ENVIRONMENT" ;;
                12) echo "DATABASE_DNS_FAILURE" ;;
                13) echo "DATABASE_TCP_FAILURE" ;;
                20) echo "DATABASE_AUTHENTICATION_FAILURE" ;;
                40) echo "DATABASE_SSL_CERTIFICATE_FAILURE" ;;
                21) echo "DATABASE_CLIENT_ERROR" ;;
                *) echo "UNKNOWN_DIAGNOSTIC_RESULT_$EXIT_CODE" ;;
              esac
              exit 0
            fi

            sleep 10
          done

          echo "DIAGNOSTIC_TIMEOUT"
          exit 1

      - name: Diagnose failed DB migration task
        run: |
          set -euo pipefail

          TASK_ARN="arn:aws:ecs:ap-southeast-2:078809710022:task/secretsharz-nonprod-assessment-migrations/8a526712a6b24e63bb268b7d0376691c"
          echo "### Failed migration task"
          aws ecs describe-tasks             --cluster secretsharz-nonprod-assessment-migrations             --tasks "$TASK_ARN"             --region "$AWS_REGION"             --query 'tasks[0].{lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,taskDefinition:taskDefinition,containers:containers[*].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason,lastStatusReason:lastStatusReason}}'             --output json || true

      - name: Verify ECS application
        run: |
          set -euo pipefail

          echo "### ECS service"
          aws ecs describe-services             --cluster secretsharz-nonprod             --services secretsharz-nonprod             --region "$AWS_REGION"             --query 'services[0].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition}'             --output json

          echo "### Running tasks"
          TASKS="$(aws ecs list-tasks             --cluster secretsharz-nonprod             --service-name secretsharz-nonprod             --region "$AWS_REGION"             --desired-status RUNNING             --query 'taskArns'             --output text)"
          test -n "$TASKS"

          aws ecs describe-tasks             --cluster secretsharz-nonprod             --tasks $TASKS             --region "$AWS_REGION"             --query 'tasks[*].{lastStatus:lastStatus,health:healthStatus,taskDefinition:taskDefinition}'             --output json

          echo "### Target health"
          TG_ARN="$(aws elbv2 describe-target-groups             --names secretsharz-nonprod-tg             --region "$AWS_REGION"             --query 'TargetGroups[0].TargetGroupArn'             --output text)"

          aws elbv2 describe-target-health             --target-group-arn "$TG_ARN"             --region "$AWS_REGION"             --query 'TargetHealthDescriptions[*].{id:Target.Id,port:Target.Port,state:TargetHealth.State,reason:TargetHealth.Reason}'             --output json

          echo "### HTTP health endpoint"
          DNS="$(aws elbv2 describe-load-balancers             --names secretsharz-nonprod             --region "$AWS_REGION"             --query 'LoadBalancers[0].DNSName'             --output text)"
          echo "http://$DNS/healthz"

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "http://$DNS/healthz" >/tmp/healthz.json; then
              cat /tmp/healthz.json
              exit 0
            fi
            echo "Health check attempt $attempt failed; waiting 15s..."
            sleep 15
          done

          echo "ECS /healthz verification failed."
          exit 1
