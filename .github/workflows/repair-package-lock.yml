name: Repair package lock

on:
  push:
    branches:
      - rebuild/platform-foundation-v1
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/repair-package-lock.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'ci: repair package lock'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Regenerate lock file
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lock file
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "ci: repair package lock"
          git push origin HEAD:rebuild/platform-foundation-v1
