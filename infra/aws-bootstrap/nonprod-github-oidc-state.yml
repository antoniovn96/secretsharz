AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Secret Sharz non-production bootstrap for GitHub Actions OIDC and
  Terraform S3 remote state in ap-southeast-2.

Parameters:
  StateBucketName:
    Type: String
    Default: ""
    Description: Optional globally unique S3 bucket name. Blank uses account-derived name.
    AllowedPattern: "^$|[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Must be a valid S3 bucket name or blank.

  GitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing GitHub Actions OIDC provider ARN.

  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

Conditions:
  CreateProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]
  HasExplicitBucketName: !Not [!Equals [!Ref StateBucketName, ""]]

Resources:
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - HasExplicitBucketName
        - !Ref StateBucketName
        - !Sub "secretsharz-terraform-state-nonprod-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Application
          Value: SecretSharz
        - Key: Environment
          Value: NonProduction
        - Key: ManagedBy
          Value: Bootstrap

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  GitHubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Application
          Value: SecretSharz
        - Key: Environment
          Value: NonProduction
        - Key: ManagedBy
          Value: Bootstrap

  GitHubActionsNonprodRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SecretSharz-GitHubActions-NonProd
      Description: GitHub Actions deployment role for Secret Sharz non-production.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubActionsTrust
            Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubActionsOidcProvider
                - !Ref GitHubOidcProviderArn
            Action:
              - sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringEquals:
                token.actions.githubusercontent.com:sub: repo:antoniovn96/secretsharz:ref:refs/heads/rebuild/platform-foundation-v1
      Tags:
        - Key: Application
          Value: SecretSharz
        - Key: Environment
          Value: NonProduction
        - Key: ManagedBy
          Value: Bootstrap

  GitHubActionsNonprodPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SecretSharz-GitHubActions-NonProd
      Roles:
        - !Ref GitHubActionsNonprodRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TerraformStateBucket
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - !GetAtt TerraformStateBucket.Arn
            Condition:
              StringLike:
                s3:prefix:
                  - secretsharz/nonprod/terraform.tfstate
                  - secretsharz/nonprod/terraform.tfstate.tflock
                  - secretsharz/nonprod/*
          - Sid: TerraformStateObject
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !Sub "${TerraformStateBucket.Arn}/secretsharz/nonprod/terraform.tfstate"
          - Sid: TerraformStateLock
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub "${TerraformStateBucket.Arn}/secretsharz/nonprod/terraform.tfstate.tflock"
          - Sid: NetworkAndLoadBalancing
            Effect: Allow
            Action:
              - ec2:AllocateAddress
              - ec2:AssociateRouteTable
              - ec2:AttachInternetGateway
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:CreateInternetGateway
              - ec2:CreateNatGateway
              - ec2:CreateRoute
              - ec2:CreateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:CreateSubnet
              - ec2:CreateTags
              - ec2:CreateVpc
              - ec2:DeleteInternetGateway
              - ec2:DeleteNatGateway
              - ec2:DeleteRoute
              - ec2:DeleteRouteTable
              - ec2:DeleteSecurityGroup
              - ec2:DeleteSubnet
              - ec2:DeleteVpc
              - ec2:DescribeAddresses
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInternetGateways
              - ec2:DescribeNatGateways
              - ec2:DescribeRouteTables
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeTags
              - ec2:DescribeVpcs
              - ec2:DetachInternetGateway
              - ec2:DisassociateRouteTable
              - ec2:ReleaseAddress
              - ec2:RevokeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:Describe*
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:RemoveTags
            Resource: "*"
          - Sid: DatabaseAndSecrets
            Effect: Allow
            Action:
              - rds:AddTagsToResource
              - rds:CreateDBInstance
              - rds:CreateDBSubnetGroup
              - rds:DeleteDBInstance
              - rds:DeleteDBSubnetGroup
              - rds:DescribeDBInstances
              - rds:DescribeDBSubnetGroups
              - rds:ListTagsForResource
              - rds:ModifyDBInstance
              - rds:ModifyDBSubnetGroup
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource: "*"
          - Sid: ContainerRegistry
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:CompleteLayerUpload
              - ecr:CreateRepository
              - ecr:DeleteRepository
              - ecr:DescribeRepositories
              - ecr:GetAuthorizationToken
              - ecr:GetRepositoryPolicy
              - ecr:InitiateLayerUpload
              - ecr:ListImages
              - ecr:PutImage
              - ecr:UploadLayerPart
            Resource: "*"
          - Sid: ContainerRuntime
            Effect: Allow
            Action:
              - ecs:CreateCluster
              - ecs:CreateService
              - ecs:DeleteCluster
              - ecs:DeleteService
              - ecs:DeregisterTaskDefinition
              - ecs:DescribeClusters
              - ecs:DescribeServices
              - ecs:DescribeTaskDefinition
              - ecs:DescribeTasks
              - ecs:ListTasks
              - ecs:RegisterTaskDefinition
              - ecs:RunTask
              - ecs:StopTask
              - ecs:UpdateService
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:DescribeLogGroups
              - logs:PutRetentionPolicy
            Resource: "*"
          - Sid: IamForEcs
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:CreatePolicy
              - iam:CreateRole
              - iam:CreateServiceLinkedRole
              - iam:DeletePolicy
              - iam:DeleteRole
              - iam:DetachRolePolicy
              - iam:GetPolicy
              - iam:GetRole
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:PassRole
            Resource: "*"
          - Sid: TerraformProviderReads
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
            Resource: "*"

Outputs:
  StateBucketName:
    Description: Terraform state S3 bucket.
    Value: !Ref TerraformStateBucket

  StateKey:
    Description: Non-production Terraform state key.
    Value: secretsharz/nonprod/terraform.tfstate

  GitHubActionsRoleArn:
    Description: GitHub Actions OIDC deployment role ARN.
    Value: !GetAtt GitHubActionsNonprodRole.Arn

  GitHubOidcProviderArn:
    Description: GitHub Actions OIDC provider ARN.
    Value: !If
      - CreateProvider
      - !Ref GitHubActionsOidcProvider
      - !Ref GitHubOidcProviderArn
